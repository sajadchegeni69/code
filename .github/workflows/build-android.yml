name: Android CI

on:
  push:
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - 'gradle/**'
      - '.aamoza/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "platform-tools"
      - run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Validate and test
        run: ./gradlew lint test --no-daemon --stacktrace
      - name: Build APK and AAB
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace
      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/*.apk
          test -s app/build/outputs/apk/release/*.apk
          test -s app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
